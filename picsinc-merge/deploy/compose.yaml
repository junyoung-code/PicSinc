services:
  web:
    build:
      context: ../..
      dockerfile: picsinc-merge/Dockerfile
    env_file: ../.env.production
    restart: unless-stopped
    expose: ["3000"]
    mem_limit: 4g
    cpus: 2
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  caddy_data:
  caddy_config:
