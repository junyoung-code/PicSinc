<!doctype html><html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>얼굴 찾기 진단</title><link rel="stylesheet" href="/diagnostic.css" /></head><body><main><p class="eyebrow">LOCAL DIAGNOSTIC · STEP 1</p><h1>사진에서 얼굴 찾기</h1><p class="lead">JPG 또는 PNG를 선택하면 Meitu의 실제 얼굴 감지 결과를 원본 위에 표시합니다. 이 화면은 감지만 수행하며, 보정·분할·얼굴 선택·합성은 실행하지 않습니다.</p><section class="card"><label class="upload"><span>사진 선택</span><input id="photoInput" type="file" accept="image/jpeg,image/png" /></label><span id="fileName" class="file-name">선택된 사진 없음</span><label class="consent"><input id="consent" type="checkbox" /> <span>이 사진을 Meitu 얼굴 감지 서비스로 전송하는 것에 동의합니다.</span></label><button id="detectButton" type="button" disabled>동의하고 얼굴 찾기</button><p id="status" role="status" aria-live="polite">사진을 선택해 주세요.</p></section><section id="result" hidden><div class="summary"><strong id="count">0명 감지</strong><span>실선: faceBox · 점선: padded ROI</span></div><div class="stage"><img id="preview" alt="선택한 사진과 얼굴 감지 경계" /><div id="boxes"></div></div><ol id="people"></ol></section></main><script type="module" src="/diagnostic.js"></script></body></html>
